<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Презентации гамм</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Цвета по бренд-буку: корпоративный темно-синий Pantone 654C и белый */
  :root{ --navy:#003A70; --white:#ffffff; --bg:#f4f6f9; --line:#dde3ea; --muted:#5a6b80; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--navy);
    font:16px/1.5 Montserrat,"Helvetica Neue",Arial,sans-serif}
  .top{background:var(--navy);color:var(--white)}
  .top .wrap{padding-top:22px;padding-bottom:22px;display:flex;align-items:center;justify-content:space-between}
  .logo{height:40px;width:auto;display:block}
  .brand{font-weight:500;letter-spacing:.12em;font-size:14px}
  .wrap{max-width:1160px;margin:0 auto;padding:0 24px}
  header.hero{padding:52px 0 36px}
  .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;font-weight:500}
  h1{font-weight:700;text-transform:uppercase;font-size:clamp(26px,3.6vw,38px);line-height:1.15;margin:0 0 14px;letter-spacing:.01em}
  .rule{width:72px;height:2px;background:var(--navy);margin:0 0 16px}
  .lead{margin:0;max-width:620px;color:var(--muted)}
  .grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));padding-bottom:64px}
  .tile{background:var(--white);border-radius:4px;overflow:hidden;display:flex;flex-direction:column;
    box-shadow:0 1px 2px rgba(0,58,112,.06),0 6px 20px rgba(0,58,112,.06);transition:transform .2s ease, box-shadow .2s ease}
  .tile:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(0,58,112,.08),0 14px 32px rgba(0,58,112,.14)}
  .cover{position:relative;aspect-ratio:16/10;background-size:cover;background-position:center;display:flex;align-items:flex-end}
  .cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,25,50,.55) 100%)}
  .cover span{position:relative;z-index:1;color:var(--white);font-weight:700;text-transform:uppercase;
    font-size:22px;letter-spacing:.04em;padding:16px 18px;text-shadow:0 1px 8px rgba(0,0,0,.25)}
  .cover span.long{font-size:16px;line-height:1.3}
  .bar{height:5px}
  .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px;flex:1}
  .meta{font-size:13px;color:var(--muted);margin:0}
  .meta b{color:var(--navy);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:12px;display:block;margin-bottom:2px}
  .btn{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;
    background:var(--navy);color:var(--white);border-radius:2px;padding:12px 16px;font-weight:700;font-size:13px;
    text-transform:uppercase;letter-spacing:.1em;transition:filter .15s}
  .btn:hover{filter:brightness(1.25)}
  .btn svg{width:16px;height:16px}
  footer{border-top:1px solid var(--line);padding:22px 0 40px;color:var(--muted);font-size:13px}
  @media (max-width:520px){ .wrap{padding:0 16px} header.hero{padding:36px 0 28px} }
</style>
</head>

/* Репозиторий определяется по адресу сайта (имя.github.io/репозиторий).
   Если сайт открыт по другому адресу — впишите вручную, например: "ivanov/presentations" */
let REPO = "";
if (!REPO && location.hostname.endsWith(".github.io")) {
  const user = location.hostname.split(".")[0];
  const repo = location.pathname.split("/").filter(Boolean)[0] || location.hostname;
  REPO = user + "/" + repo;
}

const icon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>';
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.getElementById("grid").innerHTML = PRESENTATIONS.map(p => {
  const url = "https://github.com/" + REPO + "/releases/latest/download/" + encodeURIComponent(p.file);
  const img = IMAGES[p.image] || p.image || "";
  return `<article class="tile">
    <div class="cover" style="background-color:${esc(p.color)};background-image:url('${img}')"><span class="${p.title.length > 18 ? "long" : ""}">${esc(p.title)}</span></div>
    <div class="bar" style="background:${esc(p.color)}"></div>
    <div class="body">
      <p class="meta"><b>Гамма ${esc(p.title)}</b>${p.desc ? esc(p.desc) + " · " : ""}PPTX · ${esc(p.size)}</p>
      <a class="btn" href="${url}" download>${icon}Скачать</a>
    </div>
  </article>`;
}).join("");
